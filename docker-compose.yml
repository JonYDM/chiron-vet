# ─────────────────────────────────────────────────────────────────────────────
# docker-compose para DESARROLLO LOCAL: API de Chiron + PostgreSQL.
# Uso: docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chiron
      POSTGRES_PASSWORD: chiron_dev
      POSTGRES_DB: chiron
    ports:
      - "5432:5432"
    volumes:
      - chiron_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      # Cadena de conexión a PostgreSQL (la API la lee de esta variable).
      ConnectionStrings__Chiron: "Host=db;Port=5432;Database=chiron;Username=chiron;Password=chiron_dev"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"

volumes:
  chiron_pgdata:
